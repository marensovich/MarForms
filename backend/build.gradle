plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'me.marensovich.gta5rpformapp'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Testcontainers 1.21.2 (Boot 3.5.3's) can't talk to Docker Engine 29+.
ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'net.dv8tion:JDA:6.6.0'
}

tasks.javadoc {
    source = sourceSets.main.allJava
    options.encoding = 'UTF-8'
    options.addBooleanOption('html5', true)
    options.author = true
    options.version = true
    options.links("https://docs.oracle.com/en/java/javase/21/docs/api/") // ссылки на стандартную JavaDocs
    options.addStringOption('Xdoclint:none', '-quiet') // отключить предупреждения
}

tasks.named('jar') {
    enabled = false
}

test {
    useJUnitPlatform()
}

// `./gradlew bootRun` reads backend/.env (see .env.example), so local runs
// get the same variables as Docker does from env_file.
tasks.named('bootRun') {
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines()
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') && it.contains('=') }
                .each { line ->
                    int i = line.indexOf('=')
                    environment line.substring(0, i).trim(), line.substring(i + 1).trim()
                }
    }
}

// «О системе» (ТЗ 6.6, #147): the build's version (META-INF/build-info.properties)
// and the commit it came from (git.properties). Spring Boot exposes both as beans.
springBoot {
    buildInfo {
        excludes = ['time']
    }
}

tasks.register('gitProperties') {
    def out = layout.buildDirectory.file('generated/git/git.properties')
    def repo = rootDir
    outputs.file(out)
    outputs.upToDateWhen { false }
    doLast {
        // The Docker build has no .git: it passes the commit in GIT_COMMIT.
        String commit = System.getenv('GIT_COMMIT') ?: ''
        if (!commit) {
            try {
                def git = new ProcessBuilder('git', 'rev-parse', '--short', 'HEAD').directory(repo).redirectErrorStream(true).start()
                if (git.waitFor() == 0) commit = git.inputStream.text.trim()
            } catch (ignored) {
                // No git: the commit stays unknown.
            }
        }
        def file = out.get().asFile
        file.parentFile.mkdirs()
        file.text = "git.commit.id.abbrev=${commit}\n"
    }
}

tasks.named('processResources') {
    from(tasks.named('gitProperties'))
}
