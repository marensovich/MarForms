# ============================================================
# Application Core Configuration
# ============================================================
spring.application.name=${SPRING_APPLICATION_NAME:marforms}
# ============================================================
# Server Configuration
# ============================================================
server.port=${HOST_APP_PORT:8090}
# ============================================================
# Database Configuration
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
# ============================================================
# JPA / Hibernate Configuration
# ============================================================
# Dialect for PostgreSQL — explicitly set to avoid auto-detection warnings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema managed by Flyway — Hibernate should not touch it
spring.jpa.hibernate.ddl-auto=none
# Disable Jakarta schema generation — Flyway handles all DDL
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
# Disable open-in-view pattern — prevents accidental lazy loading in view layer
spring.jpa.open-in-view=false
# ============================================================
# Flyway — Database Migration
# ============================================================
spring.flyway.enabled=true
# Location of SQL migration scripts (classpath:db/migration by default)
spring.flyway.locations=classpath:db/migration
# Do NOT baseline existing schema — migrations must be applied from scratch
spring.flyway.baseline-on-migrate=false
# ============================================================
# JWT Configuration
# ============================================================
# Secret key used for signing and verifying JWT tokens (min 256-bit for HS256)
jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (86400000 = 24 hours)
jwt.expiration=${JWT_EXPIRATION:86400000}
# ============================================================
# Frontend URL
# ============================================================
# Used in OAuthSuccessHandler to redirect after successful Discord login
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# ============================================================
# Docker Compose (Development only)
# ============================================================
# Disable Spring Boot Docker Compose integration — managed manually
spring.docker.compose.enabled=false
spring.docker.compose.file=${SPRING_DOCKER_COMPOSE_FILE:docker-compose.yml}
# ============================================================
# Discord OAuth2
# ============================================================
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET}
# Scopes: identify = basic user info, guilds = list of user's Discord servers
spring.security.oauth2.client.registration.discord.scope=identify,guilds
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
# Must match exactly the redirect URI registered in Discord Developer Portal
spring.security.oauth2.client.registration.discord.redirect-uri=${DISCORD_REDIRECT_URI:http://localhost:8090/login/oauth2/code/discord}
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
# Discord returns user ID as "id" field — used as principal name
spring.security.oauth2.client.provider.discord.user-name-attribute=id
# Bot token — separate from the OAuth2 client above, used for bot-only calls
# (fetching real guild names, listing channels). Empty default so contexts
# that never call DiscordBotClient (e.g. tests) don't need it set.
discord.bot.token=${DISCORD_BOT_TOKEN:}
# Must also be registered under OAuth2 > Redirects in the Discord Developer
# Portal, same as the login redirect-uri above — this is a separate flow
# (GuildConnectController), not the login one.
discord.bot-install-redirect-uri=${DISCORD_BOT_INSTALL_REDIRECT_URI:http://localhost:8090/api/v1/guilds/connect/callback}
# AES-256 key (base64, 32 bytes) for encrypting stored Discord user tokens
# (see TokenCipher). Blank = derived from JWT_SECRET, dev only.
app.token-encryption-key=${TOKEN_ENCRYPTION_KEY:}
# How long a member's cached Discord roles (guild_memberships.discord_roles)
# are trusted before being re-fetched via the bot on their next form visit.
app.discord.member-roles-ttl=${DISCORD_MEMBER_ROLES_TTL:PT5M}
# ============================================================
# Logging
# ============================================================
# Disable verbose OAuth2 / HTTP client logging in production
# Set to TRACE/DEBUG locally for troubleshooting auth flow
logging.level.org.springframework.security.oauth2=WARN
logging.level.org.springframework.web.client=WARN
logging.level.org.flywaydb=INFO

# ============================================================
# File attachments (E3.2, ADR 0003)
# ============================================================
# Where uploaded files are stored (a Docker volume in production; back it up).
app.files.dir=${FILES_DIR:./data/uploads}
# Multipart cap: above the 25 MB per-file platform limit (FileRules.MAX_SIZE_MB).
spring.servlet.multipart.max-file-size=26MB
spring.servlet.multipart.max-request-size=27MB

# The single image serves the SPA itself (SpaConfig): compress it and the API's
# JSON. The live journal (text/event-stream) is left out, so it is not buffered.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml

# ============================================================
# Plan limits (E4.1) — the price grid is not decided yet, so nothing is
# limited by default. A limit that is not set is unlimited. Respondents are
# never blocked: submissions-per-month only shows as exceeded to the owner.
# ============================================================
#app.plans.limits.FREE.active-forms=5
#app.plans.limits.FREE.submissions-per-month=1000
#app.plans.limits.FREE.moderators=3
#app.plans.limits.FREE.file-storage-mb=500
#app.plans.limits.PRO.active-forms=100

# ============================================================
# Stripe billing (E4.2, ADR 0004) — off until a secret key and a price are set.
# Test mode: sk_test_... key; webhook endpoint: POST /api/v1/public/billing/stripe/webhook
# with events checkout.session.completed, customer.subscription.created/updated/deleted.
# ============================================================
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.prices.PRO=${STRIPE_PRICE_PRO:}

# ============================================================
# Outbound HTTP and scheduled jobs (security audit, #103)
# ============================================================
# Timeouts for every call to Discord, Stripe and webhooks (HttpClientConfig).
app.http.connect-timeout=5s
app.http.read-timeout=10s
# The @Scheduled jobs (webhook delivery, Stripe events, health checks,
# token refresh, guild reconciliation, upload cleanup) must not queue
# behind one another on a single thread.
spring.task.scheduling.pool.size=4
# Discord IDs that get the platform's system role on sign-in (comma-separated):
# the first administrators of a fresh install (AdminBootstrapService).
app.admin-discord-ids=${ADMIN_DISCORD_IDS:}
# Origins allowed to call the API from a browser (comma-separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend-url}}
