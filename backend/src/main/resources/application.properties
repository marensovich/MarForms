# ============================================================
# Application Core Configuration
# ============================================================

# Application name - used for identification in logs and monitoring
spring.application.name=${SPRING_APPLICATION_NAME}

# Disable Redis repositories (not used in this application)
spring.data.redis.repositories.enabled=false

# ============================================================
# Server Configuration
# ============================================================

# Port on which the application will run
server.port=${HOST_APP_PORT}

# ============================================================
# Flyway Database Migration Configuration
# ============================================================

# Enable Flyway for database schema versioning and migrations
spring.flyway.enabled=true

# Location of Flyway migration scripts
spring.flyway.locations=classpath:db/migration

# ============================================================
# Application Custom Properties
# ============================================================

# URL of the frontend application for redirects after authentication
app.frontend-url=${FRONTEND_URL}

# ============================================================
# JWT (JSON Web Token) Configuration
# ============================================================

# Secret key used for signing JWT tokens
jwt.secret=${JWT_SECRET}

# Token expiration time in milliseconds
jwt.expiration=${JWT_EXPIRATION}

# ============================================================
# Docker Compose Configuration
# ============================================================

# Disable Docker Compose integration (not used in production)
spring.docker.compose.enabled=false

# Path to Docker Compose file (if needed)
spring.docker.compose.file=${SPRING_DOCKER_COMPOSE_FILE}

# ============================================================
# Database Configuration
# ============================================================

# JDBC connection URL for PostgreSQL
spring.datasource.url=${DB_URL}

# Database username
spring.datasource.username=${DB_USERNAME}

# Database password
spring.datasource.password=${DB_PASSWORD}

# Database driver class
spring.datasource.driver-class-name=${DB_DRIVER}

# Hibernate DDL mode - automatically updates schema on startup (for development)
spring.jpa.hibernate.ddl-auto=update

# Database dialect for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# Discord OAuth2 Configuration
# ============================================================

# Client ID for Discord OAuth2 application
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID}

# Client secret for Discord OAuth2 application
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET}

# Required OAuth2 scopes - allows access to user identity, guilds, and guild members
spring.security.oauth2.client.registration.discord.scope=identify,guilds,guilds.members.read

# OAuth2 authorization grant type
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code

# Redirect URI after successful authentication (must match Discord app configuration)
spring.security.oauth2.client.registration.discord.redirect-uri=${DISCORD_REDIRECT_URI}

# Discord OAuth2 Authorization endpoint
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/oauth2/authorize

# Discord OAuth2 Token endpoint
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token

# Discord OAuth2 User Info endpoint for fetching user data
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me

# Attribute name used to identify the user (Discord user ID)
spring.security.oauth2.client.provider.discord.user-name-attribute=id