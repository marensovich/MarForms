# Test-only overrides — picked up automatically from the test classpath.
# Uses an in-memory H2 database instead of the real Postgres instance so
# unit/slice tests don't need Docker running.
spring.application.name=backend-test

spring.datasource.url=jdbc:h2:mem:marforms;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE,USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway targets real Postgres-only syntax (JSONB, gen_random_uuid()) —
# tests let Hibernate generate the schema from entities instead.
spring.flyway.enabled=false

jwt.secret=test-secret-key-not-for-production-use-only-in-tests-0123456789
jwt.expiration=86400000

app.frontend-url=http://localhost:5173

spring.security.oauth2.client.registration.discord.client-id=test-client-id
spring.security.oauth2.client.registration.discord.client-secret=test-client-secret
spring.security.oauth2.client.registration.discord.scope=identify,guilds
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri=http://localhost:8090/login/oauth2/code/discord
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id

# Per-IP limits would trip over the suite's own requests; RateLimitFilterTest covers them.
app.rate-limit.enabled=false
