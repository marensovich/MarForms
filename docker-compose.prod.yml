# MarForms in production: the single image (site + API on one port) and Postgres.
#   cp backend/.env.example .env   # fill in secrets, see backend/README.md
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# The image comes from GitHub Packages (set MARFORMS_VERSION, default latest);
# `--build` builds it from this checkout instead. Put TLS in front of port
# HTTP_PORT and set FRONTEND_URL, DISCORD_REDIRECT_URI and
# DISCORD_BOT_INSTALL_REDIRECT_URI to the public https origin.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-marforms}
      POSTGRES_USER: ${DB_USERNAME:-marforms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  marforms:
    image: ghcr.io/marensovich/marforms:${MARFORMS_VERSION:-latest}
    build:
      context: .
      args:
        # Shown in «Система → О системе»: GIT_COMMIT=$(git rev-parse --short HEAD)
        GIT_COMMIT: ${GIT_COMMIT:-}
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-marforms}
      HOST_APP_PORT: "8090"
    ports:
      - "${HTTP_PORT:-8090}:8090"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
