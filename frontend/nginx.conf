# Serves the SPA and proxies the backend on the same origin. Per-IP limits
# here sit in front of the application's own (RateLimitFilter); the backend
# should run with SERVER_FORWARD_HEADERS_STRATEGY=native behind this proxy.
limit_req_zone $binary_remote_addr zone=public_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

# Behind an outer proxy on the same host or network (the one that ends TLS),
# the client is the one it names, not the proxy: otherwise every visitor
# shares one per-IP limit. Only private addresses are trusted to say so.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The scheme the visitor used: the outer proxy's, when there is one. Plain
# $scheme would read "http" behind a TLS proxy, and the session cookie would
# lose its Secure flag.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream marforms_backend {
    server backend:8090;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are capped at 25 MB by the application (26 MB multipart).
    client_max_body_size 27m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;

    location /api/v1/public/ {
        limit_req zone=public_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://marforms_backend;
    }

    location ~ ^/(api/v1/auth/|oauth2/|login/) {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://marforms_backend;
    }

    # The journal's «Live» (server-sent events): each entry goes out as it
    # comes, and the connection stays open between heartbeats (25 s).
    location = /api/v1/admin/logs/stream {
        proxy_pass http://marforms_backend;
        proxy_http_version 1.1;
        # A location with its own proxy_set_header inherits none of the server's.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://marforms_backend;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
