<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сервер — журнал действий</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}}; display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--bg); color: var(--tx); font-family: Onest, 'Segoe UI', system-ui, sans-serif">
  <div style="flex: 1 1 248px; max-width: 100%; background: var(--sf); border-right: 1px solid var(--bd)">
    <dc-import name="Sidebar" active="servers" dark="{{dark}}" hint-size="248px,860px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="WsHeader" tab="audit" dark="{{dark}}" hint-size="100%,250px"></dc-import>
    <div style="padding: 24px 40px 48px; display: flex; flex-direction: column; gap: 20px; max-width: 980px">
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <button style="height: 40px; padding: 0 12px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf); color: var(--tx); font-family: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px">Кто: все модераторы<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mu)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        <button style="height: 40px; padding: 0 12px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf); color: var(--tx); font-family: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px">Действие: любое<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mu)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        <button style="height: 40px; padding: 0 12px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf); color: var(--tx); font-family: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mu)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 4h18v18H3zM16 2v4M8 2v4M3 10h18"></path></svg>Последние 7 дней</button>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <section style="display: flex; flex-direction: column; gap: 0">
          <h2 style="margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--mu); text-transform: uppercase; letter-spacing: 0.06em">{{g.day}}</h2>
          <div style="border: 1px solid var(--bd); border-radius: 16px; background: var(--sf); padding: 4px 0">
            <sc-for list="{{g.items}}" as="e" hint-placeholder-count="4">
              <div style="display: flex; gap: 14px; padding: 14px 18px">
                <span style="{{e.icSt}}; flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{e.ic}}"></path></svg></span>
                <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                  <span style="font-size: 14px; line-height: 1.45"><b>{{e.who}}</b> {{e.what}} <span style="color: var(--prt); font-weight: 500">{{e.target}}</span></span>
                  <sc-if value="{{e.hasDetail}}" hint-placeholder-val="{{false}}"><span style="padding: 8px 10px; border-radius: 10px; background: var(--s2); font-size: 13px; color: var(--mu); font-family: 'JetBrains Mono', monospace">{{e.detail}}</span></sc-if>
                </div>
                <time style="flex: none; font-size: 13px; color: var(--mu); font-variant-numeric: tabular-nums">{{e.time}}</time>
              </div>
            </sc-for>
          </div>
        </section>
      </sc-for>
      <button style="align-self: center; height: 40px; padding: 0 16px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf); color: var(--tx); font-family: inherit; font-size: 14px; font-weight: 500">Показать ещё</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  th(d){const t=d?{bg:'#111115',sf:'#1A1A20',s2:'#22222A',tx:'#ECECEF',mu:'#A3A3AD',bd:'#2E2E37',pr:'#5B54E0',prs:'#25234B',prt:'#B4B0FF',amb:'#3B2A0A',amt:'#FCD34D',rdb:'#3D1517',rdt:'#FCA5A5',gnb:'#0E2F1D',gnt:'#86EFAC',ov:'rgba(0,0,0,0.62)'}:{bg:'#FAFAFB',sf:'#FFFFFF',s2:'#F4F4F6',tx:'#1E1E24',mu:'#6B6B76',bd:'#E4E4E7',pr:'#3730A3',prs:'#EEEEFB',prt:'#3730A3',amb:'#FEF3C7',amt:'#92400E',rdb:'#FEE2E2',rdt:'#B91C1C',gnb:'#DCFCE7',gnt:'#166534',ov:'rgba(20,20,30,0.45)'};return Object.keys(t).map(k=>'--'+k+':'+t[k]).join(';');}
  renderVals() {
    const K = {
      ok: ['background: var(--gnb); color: var(--gnt)', 'M20 6 9 17l-5-5'],
      no: ['background: var(--rdb); color: var(--rdt)', 'M18 6 6 18M6 6l12 12'],
      rev: ['background: var(--prs); color: var(--prt)', 'M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z'],
      form: ['background: var(--s2); color: var(--tx)', 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6'],
      ban: ['background: var(--rdb); color: var(--rdt)', 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM4.93 4.93l14.14 14.14'],
      user: ['background: var(--amb); color: var(--amt)', 'M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M8.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM20 8v6M23 11h-6']
    };
    const e = (k, who, what, target, time, detail) => ({ icSt: K[k][0], ic: K[k][1], who, what, target, time, detail: detail || '', hasDetail: !!detail });
    return {
      tv: this.th(!!this.props.dark), dark: !!this.props.dark,
      groups: [
        { day: 'Сегодня, 15 октября', items: [
          e('ok', 'Кирилл Н.', 'принял заявку', '#1041 · mira — Набор в EMS', '14:32', 'комментарий: «Добро пожаловать в EMS»'),
          e('form', 'Анна К.', 'изменила поля формы', 'Заявка в LSPD', '13:05', 'fields: +1 (conditional «Где служили?»), required: bio'),
          e('no', 'Кирилл Н.', 'отклонил заявку', '#1039 · dimon228', '11:47', 'причина: «Менее 30 часов на сервере»'),
          e('ban', 'dmitry.w', 'забанил пользователя', 'spam_bot_9000', '10:20', 'причина: спам заявками · срок: навсегда')
        ] },
        { day: 'Вчера, 14 октября', items: [
          e('rev', 'Анна К.', 'запросила доработку', '#1043 · morozov_alex', '20:10'),
          e('form', 'Кирилл Н.', 'создал черновик формы', 'Заявка в банду Ballas', '18:00'),
          e('user', 'Кирилл Н.', 'добавил модератора', 'dmitry.w', '16:44', 'ID 334019283746102938'),
          e('form', 'Анна К.', 'закрыла приём', 'Хэллоуин-ивент 2026', '09:15')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
