<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сервер — модераторы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}}; display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--bg); color: var(--tx); font-family: Onest, 'Segoe UI', system-ui, sans-serif">
  <div style="flex: 1 1 248px; max-width: 100%; background: var(--sf); border-right: 1px solid var(--bd)">
    <dc-import name="Sidebar" active="servers" dark="{{dark}}" hint-size="248px,860px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="WsHeader" tab="mods" dark="{{dark}}" hint-size="100%,250px"></dc-import>
    <div style="padding: 24px 40px 48px; display: flex; flex-direction: column; gap: 20px; max-width: 980px">
      <section style="position: relative; padding: 20px; border: 1px solid var(--bd); border-radius: 16px; background: var(--sf); display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 17px">Добавить модератора</h2><p style="margin: 0; font-size: 14px; color: var(--mu)">Модераторы рассматривают заявки и управляют формами сервера. Тариф и баны платформы им недоступны.</p></div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <label style="flex: 1 1 320px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1.5px solid var(--pr); border-radius: 12px; background: var(--sf); box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mu)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"></path></svg><input value="lena" aria-label="Discord ID или имя пользователя" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--tx); font-family: inherit; font-size: 14px; outline: 0"></label>
          <button style="height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--pr); color: #fff; font-family: inherit; font-size: 14px; font-weight: 600">Добавить</button>
        </div>
        <div role="listbox" style="max-width: 520px; padding: 6px; border: 1px solid var(--bd); border-radius: 14px; background: var(--sf); box-shadow: 0 12px 32px rgba(20,20,40,0.12); display: flex; flex-direction: column; gap: 2px">
          <span style="padding: 6px 10px; font-size: 12px; color: var(--mu)">Участники сервера</span>
          <div role="option" aria-selected="true" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--s2)"><span style="width: 30px; height: 30px; border-radius: 999px; background: #BE185D; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600">Л</span><span style="flex: 1; font-size: 14px"><b>lena</b>.vibe</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--mu)">612009871234567890</span></div>
          <div role="option" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px"><span style="width: 30px; height: 30px; border-radius: 999px; background: #5865F2; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600">L</span><span style="flex: 1; font-size: 14px"><b>Lena</b>Moon</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--mu)">498221093847561299</span></div>
        </div>
      </section>
      <section style="border: 1px solid var(--bd); border-radius: 16px; background: var(--sf)">
        <div style="padding: 16px 20px; border-bottom: 1px solid var(--bd); display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 17px">Команда · 4</h2></div>
        <sc-for list="{{mods}}" as="m" hint-placeholder-count="4">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--bd)">
            <span style="{{m.avSt}}; flex: none; width: 40px; height: 40px; border-radius: 999px; color: #fff; display: grid; place-items: center; font-weight: 600">{{m.ini}}</span>
            <div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 15px">{{m.name}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--mu)">{{m.id}}</span></div>
            <span style="{{m.roleSt}}; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600">{{m.role}}</span>
            <span style="width: 180px; font-size: 13px; color: var(--mu)">{{m.added}}</span>
            <button aria-disabled="{{m.ownerStr}}" style="{{m.btnSt}}; height: 36px; padding: 0 12px; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 500">{{m.btn}}</button>
          </div>
        </sc-for>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  th(d){const t=d?{bg:'#111115',sf:'#1A1A20',s2:'#22222A',tx:'#ECECEF',mu:'#A3A3AD',bd:'#2E2E37',pr:'#5B54E0',prs:'#25234B',prt:'#B4B0FF',amb:'#3B2A0A',amt:'#FCD34D',rdb:'#3D1517',rdt:'#FCA5A5',gnb:'#0E2F1D',gnt:'#86EFAC',ov:'rgba(0,0,0,0.62)'}:{bg:'#FAFAFB',sf:'#FFFFFF',s2:'#F4F4F6',tx:'#1E1E24',mu:'#6B6B76',bd:'#E4E4E7',pr:'#3730A3',prs:'#EEEEFB',prt:'#3730A3',amb:'#FEF3C7',amt:'#92400E',rdb:'#FEE2E2',rdt:'#B91C1C',gnb:'#DCFCE7',gnt:'#166534',ov:'rgba(20,20,30,0.45)'};return Object.keys(t).map(k=>'--'+k+':'+t[k]).join(';');}
  renderVals() {
    const md = (name, ini, c, id, owner, added) => ({ name, ini, avSt: 'background: ' + c, id: 'ID ' + id, role: owner ? 'Владелец' : 'Модератор', roleSt: owner ? 'background: var(--prs); color: var(--prt)' : 'border: 1px solid var(--bd); color: var(--tx)', added, btn: owner ? 'Нельзя удалить' : 'Удалить', ownerStr: owner ? 'true' : 'false', btnSt: owner ? 'border: 0; background: transparent; color: var(--mu)' : 'border: 1px solid var(--bd); background: var(--sf); color: var(--rdt)' });
    return {
      tv: this.th(!!this.props.dark), dark: !!this.props.dark,
      mods: [
        md('Кирилл Н. · @kirill_nv', 'К', '#0E7490', '284019574330621952', true, 'Создатель пространства'),
        md('Анна К. · @anna_k', 'А', '#7C3AED', '310928475610293847', false, 'Добавлена 2 сен · Кирилл Н.'),
        md('dmitry.w', 'D', '#B45309', '334019283746102938', false, 'Добавлен 14 окт · Кирилл Н.'),
        md('Mr. Green · @green', 'G', '#15803D', '401928374651029384', false, 'Добавлен 20 авг · Кирилл Н.')
      ]
    };
  }
}
</script>
</body>
</html>
