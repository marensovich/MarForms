<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сервер — тариф</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}}; display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--bg); color: var(--tx); font-family: Onest, 'Segoe UI', system-ui, sans-serif">
  <div style="flex: 1 1 248px; max-width: 100%; background: var(--sf); border-right: 1px solid var(--bd)">
    <dc-import name="Sidebar" active="servers" dark="{{dark}}" hint-size="248px,860px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="WsHeader" tab="billing" dark="{{dark}}" hint-size="100%,250px"></dc-import>
    <div style="padding: 24px 40px 48px; display: flex; flex-direction: column; gap: 20px; max-width: 980px">
      <div style="display: flex; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--s2); border: 1px solid var(--bd); font-size: 14px; line-height: 1.45"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--mu)" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01"></path></svg><span><b>Оплата временно недоступна.</b> Смена тарифа появится позже — сейчас все серверы работают на Free с указанными лимитами.</span></div>
      <section style="padding: 22px; border: 1.5px solid var(--pr); border-radius: 16px; background: var(--sf); display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600; color: var(--prt); text-transform: uppercase; letter-spacing: 0.06em">Текущий тариф</span><h2 style="margin: 0; font-size: 24px">Free</h2></div><span style="padding: 6px 12px; border-radius: 999px; background: var(--prs); color: var(--prt); font-size: 13px; font-weight: 600">Активен</span></div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{limits}}" as="l" hint-placeholder-count="4">
            <div style="padding: 14px; border-radius: 12px; background: var(--s2); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: var(--mu)">{{l.k}}</span><span style="font-size: 18px; font-weight: 600">{{l.v}}</span></div>
          </sc-for>
        </div>
      </section>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; opacity: 0.6" aria-disabled="true">
        <div style="padding: 20px; border: 1px dashed var(--bd); border-radius: 16px; display: flex; flex-direction: column; gap: 10px"><h3 style="margin: 0; font-size: 18px">Pro</h3><span style="font-size: 14px; color: var(--mu)">[ЦЕНА] / месяц · [ЛИМИТЫ PRO]</span><button disabled="" style="height: 40px; border: 1px solid var(--bd); border-radius: 12px; background: var(--s2); color: var(--mu); font-family: inherit; font-size: 14px">Скоро</button></div>
        <div style="padding: 20px; border: 1px dashed var(--bd); border-radius: 16px; display: flex; flex-direction: column; gap: 10px"><h3 style="margin: 0; font-size: 18px">Сеть серверов</h3><span style="font-size: 14px; color: var(--mu)">[ЦЕНА] / месяц · [ЛИМИТЫ]</span><button disabled="" style="height: 40px; border: 1px solid var(--bd); border-radius: 12px; background: var(--s2); color: var(--mu); font-family: inherit; font-size: 14px">Скоро</button></div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  th(d){const t=d?{bg:'#111115',sf:'#1A1A20',s2:'#22222A',tx:'#ECECEF',mu:'#A3A3AD',bd:'#2E2E37',pr:'#5B54E0',prs:'#25234B',prt:'#B4B0FF',amb:'#3B2A0A',amt:'#FCD34D',rdb:'#3D1517',rdt:'#FCA5A5',gnb:'#0E2F1D',gnt:'#86EFAC',ov:'rgba(0,0,0,0.62)'}:{bg:'#FAFAFB',sf:'#FFFFFF',s2:'#F4F4F6',tx:'#1E1E24',mu:'#6B6B76',bd:'#E4E4E7',pr:'#3730A3',prs:'#EEEEFB',prt:'#3730A3',amb:'#FEF3C7',amt:'#92400E',rdb:'#FEE2E2',rdt:'#B91C1C',gnb:'#DCFCE7',gnt:'#166534',ov:'rgba(20,20,30,0.45)'};return Object.keys(t).map(k=>'--'+k+':'+t[k]).join(';');}
  renderVals() {
    return {
      tv: this.th(!!this.props.dark), dark: !!this.props.dark,
      limits: [{ k: 'Активные формы', v: '5' }, { k: 'Заявки в месяц', v: '1 000' }, { k: 'Файл в ответе', v: 'до 10 МБ' }, { k: 'Хранение заявок', v: '90 дней' }]
    };
  }
}
</script>
</body>
</html>
