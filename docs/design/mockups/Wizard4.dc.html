<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мастер формы — вебхуки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}}; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--tx); font-family: Onest, 'Segoe UI', system-ui, sans-serif">
  <dc-import name="WizStepper" step="{{4}}" dark="{{dark}}" hint-size="100%,88px"></dc-import>
  <div style="flex: 1; width: 100%; max-width: 1000px; margin: 0 auto; padding: 32px 28px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 26px">Уведомления в Discord</h1><p style="margin: 0; font-size: 15px; color: var(--mu)">Вебхуки отправляют новые заявки и решения модераторов в каналы сервера.</p></div>
      <div style="display: flex; gap: 8px">
        <button style="height: 42px; padding: 0 14px; border: 0; border-radius: 12px; background: transparent; color: var(--prt); font-family: inherit; font-size: 14px; font-weight: 600">Вставить URL вручную</button>
        <button style="height: 42px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--pr); color: #fff; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9z"></path></svg>Создать вебхук через бота</button>
      </div>
    </div>
    <div style="border: 1px solid var(--bd); border-radius: 16px; background: var(--sf)">
      <sc-for list="{{hooks}}" as="h" hint-placeholder-count="3">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--bd)">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: var(--s2); color: var(--mu); display: grid; place-items: center; font-size: 18px; font-weight: 600">#</span>
          <div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 600; font-size: 15px">{{h.ch}}</span>
            <span style="font-size: 13px; color: var(--mu)">{{h.events}}</span>
            <span style="{{h.noteSt}}; font-size: 13px">{{h.note}}</span>
          </div>
          <span style="{{h.st}}; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{h.ic}}"></path></svg>{{h.status}}</span>
          <div style="display: flex; gap: 6px">
            <button style="height: 36px; padding: 0 12px; border: 1px solid var(--bd); border-radius: 10px; background: var(--sf); color: var(--tx); font-family: inherit; font-size: 13px; font-weight: 500">{{h.action}}</button>
            <button aria-label="Удалить вебхук" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--mu); display: grid; place-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4h6v2"></path></svg></button>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--s2); font-size: 14px; line-height: 1.45; color: var(--mu)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01"></path></svg>Вебхуки можно добавить позже. Без них заявки всё равно видны во вкладке «Заявки».</div>
  </div>
  <footer style="position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 28px; background: var(--sf); border-top: 1px solid var(--bd)">
    <a href="/Wizard3.dc.html" style="height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--bd); border-radius: 12px; color: var(--tx); text-decoration: none; font-size: 14px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Назад</a>
    <div style="display: flex; gap: 8px">
      <a href="/WsForms.dc.html" style="height: 44px; padding: 0 16px; display: flex; align-items: center; border: 1px solid var(--bd); border-radius: 12px; color: var(--tx); text-decoration: none; font-size: 14px; font-weight: 500">Сохранить черновик</a>
      <a href="/WsForms.dc.html" style="height: 44px; padding: 0 18px; display: flex; align-items: center; gap: 8px; border-radius: 12px; background: var(--pr); color: #fff; text-decoration: none; font-size: 14px; font-weight: 600">Опубликовать форму</a>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  th(d){const t=d?{bg:'#111115',sf:'#1A1A20',s2:'#22222A',tx:'#ECECEF',mu:'#A3A3AD',bd:'#2E2E37',pr:'#5B54E0',prs:'#25234B',prt:'#B4B0FF',amb:'#3B2A0A',amt:'#FCD34D',rdb:'#3D1517',rdt:'#FCA5A5',gnb:'#0E2F1D',gnt:'#86EFAC',ov:'rgba(0,0,0,0.62)'}:{bg:'#FAFAFB',sf:'#FFFFFF',s2:'#F4F4F6',tx:'#1E1E24',mu:'#6B6B76',bd:'#E4E4E7',pr:'#3730A3',prs:'#EEEEFB',prt:'#3730A3',amb:'#FEF3C7',amt:'#92400E',rdb:'#FEE2E2',rdt:'#B91C1C',gnb:'#DCFCE7',gnt:'#166534',ov:'rgba(20,20,30,0.45)'};return Object.keys(t).map(k=>'--'+k+':'+t[k]).join(';');}
  renderVals() {
    return {
      tv: this.th(!!this.props.dark), dark: !!this.props.dark,
      hooks: [
        { ch: '#заявки-lspd', events: 'Новые заявки · решения модераторов', note: 'Последняя доставка 2 мин назад', noteSt: 'color: var(--mu)', status: 'Работает', st: 'background: var(--gnb); color: var(--gnt)', ic: 'M20 6 9 17l-5-5', action: 'Тест' },
        { ch: '#логи-форм', events: 'Решения модераторов', note: '3 ошибки за сутки — Discord ограничивает частоту, повторяем', noteSt: 'color: var(--amt)', status: 'С перебоями', st: 'background: var(--amb); color: var(--amt)', ic: 'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01', action: 'Тест' },
        { ch: '#старый-набор', events: 'Новые заявки', note: 'Вебхук удалён в Discord (404)', noteSt: 'color: var(--rdt)', status: 'Недействителен', st: 'background: var(--rdb); color: var(--rdt)', ic: 'M18 6 6 18M6 6l12 12', action: 'Пересоздать' }
      ]
    };
  }
}
</script>
</body>
</html>
