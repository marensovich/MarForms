<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Предпросмотр формы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}}; min-height: 100vh; display: flex; flex-direction: column; background: var(--s2); color: var(--tx); font-family: Onest, 'Segoe UI', system-ui, sans-serif">
  <header style="height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 12px; background: var(--sf); border-bottom: 1px solid var(--bd)">
    <a href="/FormEdit.dc.html" style="height: 36px; padding: 0 12px; border: 1px solid var(--bd); border-radius: 10px; color: var(--tx); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>К редактору</a>
    <span style="font-size: 15px; font-weight: 700">Предпросмотр · Набор в LSPD</span>
    <span style="padding: 3px 9px; border-radius: 99px; background: var(--amb); color: var(--amt); font-size: 12px; font-weight: 600">Ответы не сохраняются</span>
    <div role="tablist" aria-label="Устройство" style="margin-left: auto; display: flex; border: 1px solid var(--bd); border-radius: 10px; padding: 3px; background: var(--bg)">
      <button role="tab" onClick="{{toD}}" aria-selected="{{isDesk}}" style="{{segD}}; height: 30px; padding: 0 12px; border: 0; border-radius: 8px; font-family: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 3H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM8 21h8M12 17v4"></path></svg>Компьютер</button>
      <button role="tab" onClick="{{toM}}" aria-selected="{{isMob}}" style="{{segM}}; height: 30px; padding: 0 12px; border: 0; border-radius: 8px; font-family: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM12 18h.01"></path></svg>Телефон</button>
    </div>
    <button style="height: 36px; padding: 0 12px; border: 1px solid var(--bd); border-radius: 10px; background: var(--sf); color: var(--tx); font-family: inherit; font-size: 13px">Как участник без роли ▾</button>
  </header>
  <div style="flex: 1; padding: 28px; display: flex; justify-content: center; align-items: flex-start">
    <sc-if value="{{isDesk}}" hint-placeholder-val="{{true}}">
      <div style="width: 100%; max-width: 1180px; border: 1px solid var(--bd); border-radius: 14px; overflow: hidden; background: var(--sf); box-shadow: 0 20px 50px rgba(10,10,30,0.12)">
        <div style="height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 10px; background: var(--bg); border-bottom: 1px solid var(--bd)"><span style="display: flex; gap: 6px"><span style="width: 11px; height: 11px; border-radius: 99px; background: #F87171"></span><span style="width: 11px; height: 11px; border-radius: 99px; background: #FBBF24"></span><span style="width: 11px; height: 11px; border-radius: 99px; background: #34D399"></span></span><span style="flex: 1; max-width: 420px; margin: 0 auto; height: 26px; border-radius: 7px; background: var(--sf); border: 1px solid var(--bd); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--mu); display: flex; align-items: center; justify-content: center">marforms.app/f/lspd-academy</span></div>
        <div style="height: 760px; overflow: hidden"><dc-import name="FormDesktop" dark="{{dark}}" hint-size="100%,760px"></dc-import></div>
      </div>
    </sc-if>
    <sc-if value="{{isMob}}" hint-placeholder-val="{{false}}">
      <div style="padding: 12px; border-radius: 54px; background: #1E1E24; box-shadow: 0 20px 50px rgba(10,10,30,0.2)"><div style="width: 390px; height: 820px; border-radius: 42px; overflow: hidden"><dc-import name="FormPublic" dark="{{dark}}" hint-size="390px,3760px"></dc-import></div></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"device":{"editor":"enum","options":["desktop","mobile"],"default":"desktop"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  th(d){const t=d?{bg:'#111115',sf:'#1A1A20',s2:'#22222A',tx:'#ECECEF',mu:'#A3A3AD',bd:'#2E2E37',pr:'#5B54E0',prs:'#25234B',prt:'#B4B0FF',amb:'#3B2A0A',amt:'#FCD34D',rdb:'#3D1517',rdt:'#FCA5A5',gnb:'#0E2F1D',gnt:'#86EFAC',ov:'rgba(0,0,0,0.62)'}:{bg:'#FAFAFB',sf:'#FFFFFF',s2:'#F4F4F6',tx:'#1E1E24',mu:'#6B6B76',bd:'#E4E4E7',pr:'#3730A3',prs:'#EEEEFB',prt:'#3730A3',amb:'#FEF3C7',amt:'#92400E',rdb:'#FEE2E2',rdt:'#B91C1C',gnb:'#DCFCE7',gnt:'#166534',ov:'rgba(20,20,30,0.45)'};return Object.keys(t).map(k=>'--'+k+':'+t[k]).join(';');}
  renderVals() {
    const dev = (this.state && this.state.dev) || this.props.device || 'desktop';
    const sel = 'background: var(--sf); color: var(--tx); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08)', un = 'background: transparent; color: var(--mu); font-weight: 500';
    return { tv: this.th(!!this.props.dark), dark: !!this.props.dark, isDesk: dev === 'desktop', isMob: dev === 'mobile', segD: dev === 'desktop' ? sel : un, segM: dev === 'mobile' ? sel : un, toD: () => this.setState({ dev: 'desktop' }), toM: () => this.setState({ dev: 'mobile' }) };
  }
}
</script>
</body>
</html>
