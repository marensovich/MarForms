<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Шапка рабочего пространства сервера</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}}; width: 100%; box-sizing: border-box; padding: 24px 40px 0; display: flex; flex-direction: column; gap: 18px; background: var(--sf); border-bottom: 1px solid var(--bd); color: var(--tx); font-family: Onest, 'Segoe UI', system-ui, sans-serif">
  <nav aria-label="Хлебные крошки" style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mu)"><a href="/Servers.dc.html" style="color: var(--mu); text-decoration: none">Мои серверы</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg><span style="color: var(--tx); font-weight: 500">Los Santos RP</span></nav>
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
    <span style="width: 52px; height: 52px; border-radius: 16px; background: #B45309; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px">LS</span>
    <div style="flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 24px; letter-spacing: -0.01em">Los Santos RP</h1>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; font-weight: 600">
        <span style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: var(--gnb); color: var(--gnt)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Бот подключён</span>
        <span style="padding: 3px 9px; border-radius: 999px; border: 1px solid var(--bd)">Вы: Владелец</span>
        <span style="padding: 3px 9px; border-radius: 999px; border: 1px solid var(--bd); color: var(--mu); font-family: 'JetBrains Mono', monospace; font-weight: 500">ID 902114583226052618</span>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
      <div style="width: 200px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: var(--mu)">Активные формы</span><span style="font-weight: 600; color: var(--amt)">4 / 5</span></div>
        <div style="height: 6px; border-radius: 999px; background: var(--s2); overflow: hidden"><div style="width: 80%; height: 100%; border-radius: 999px; background: #D97706"></div></div>
      </div>
      <div style="width: 200px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: var(--mu)">Заявки в октябре</span><span style="font-weight: 600">312 / 1 000</span></div>
        <div style="height: 6px; border-radius: 999px; background: var(--s2); overflow: hidden"><div style="width: 31%; height: 100%; border-radius: 999px; background: var(--pr)"></div></div>
      </div>
      <span style="padding: 6px 10px; border-radius: 10px; background: var(--s2); font-size: 12px; font-weight: 600">Тариф Free</span>
      <a href="/Wizard1.dc.html" style="height: 40px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-radius: 12px; background: var(--pr); color: #fff; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Новая форма</a>
    </div>
  </div>
  <div role="tablist" style="display: flex; gap: 4px; overflow-x: auto">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
      <a role="tab" href="{{t.href}}" aria-selected="{{t.sel}}" style="{{t.st}}; flex: none; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; text-decoration: none; font-size: 14px; border-bottom: 2px solid transparent">{{t.t}}<sc-if value="{{t.hasN}}" hint-placeholder-val="{{false}}"><span style="min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--pr); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; box-sizing: border-box">{{t.n}}</span></sc-if></a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"enum","options":["forms","subs","audit","mods","bans","billing"],"default":"forms"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1192,"height":250}}'>
class Component extends DCLogic {
  th(d){const t=d?{bg:'#111115',sf:'#1A1A20',s2:'#22222A',tx:'#ECECEF',mu:'#A3A3AD',bd:'#2E2E37',pr:'#5B54E0',prs:'#25234B',prt:'#B4B0FF',amb:'#3B2A0A',amt:'#FCD34D',rdb:'#3D1517',rdt:'#FCA5A5',gnb:'#0E2F1D',gnt:'#86EFAC',ov:'rgba(0,0,0,0.62)'}:{bg:'#FAFAFB',sf:'#FFFFFF',s2:'#F4F4F6',tx:'#1E1E24',mu:'#6B6B76',bd:'#E4E4E7',pr:'#3730A3',prs:'#EEEEFB',prt:'#3730A3',amb:'#FEF3C7',amt:'#92400E',rdb:'#FEE2E2',rdt:'#B91C1C',gnb:'#DCFCE7',gnt:'#166534',ov:'rgba(20,20,30,0.45)'};return Object.keys(t).map(k=>'--'+k+':'+t[k]).join(';');}
  renderVals() {
    const a = this.props.tab || 'forms';
    const tb = (k, t, href, n) => ({ t, href, n: n || '', hasN: !!n, sel: k === a ? 'true' : 'false', st: k === a ? 'color: var(--prt); font-weight: 600; border-bottom-color: var(--pr)' : 'color: var(--mu); font-weight: 500' });
    return {
      tv: this.th(!!this.props.dark),
      tabs: [tb('forms', 'Формы', '/WsForms.dc.html'), tb('subs', 'Заявки', '/WsSubmissions.dc.html', '12'), tb('audit', 'Журнал', '/WsAudit.dc.html'), tb('mods', 'Модераторы', '/WsModerators.dc.html'), tb('bans', 'Баны', '/WsBans.dc.html'), tb('billing', 'Тариф', '/WsBilling.dc.html')]
    };
  }
}
</script>
</body>
</html>
