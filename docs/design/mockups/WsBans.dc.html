<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сервер — баны</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}}; display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--bg); color: var(--tx); font-family: Onest, 'Segoe UI', system-ui, sans-serif">
  <div style="flex: 1 1 248px; max-width: 100%; background: var(--sf); border-right: 1px solid var(--bd)">
    <dc-import name="Sidebar" active="servers" dark="{{dark}}" hint-size="248px,860px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="WsHeader" tab="bans" dark="{{dark}}" hint-size="100%,250px"></dc-import>
    <div style="padding: 24px 40px 48px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <section style="flex: 1 1 320px; max-width: 380px; padding: 20px; border: 1px solid var(--bd); border-radius: 16px; background: var(--sf); display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 17px">Забанить пользователя</h2><p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--mu)">Бан закрывает доступ ко всем формам этого сервера. В Discord пользователь остаётся.</p></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="bu" style="font-size: 13px; font-weight: 600">Discord ID или имя</label><input id="bu" placeholder="Например, 551203984471236608" style="height: 44px; padding: 0 12px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf); color: var(--tx); font-family: inherit; font-size: 14px"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="br" style="font-size: 13px; font-weight: 600">Причина</label><textarea id="br" rows="3" placeholder="Видна пользователю на странице формы" style="padding: 10px 12px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf); color: var(--tx); font-family: inherit; font-size: 14px; resize: vertical"></textarea></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600">Срок</span><button style="height: 44px; padding: 0 12px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf); color: var(--tx); font-family: inherit; font-size: 14px; display: flex; align-items: center; justify-content: space-between">Навсегда<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mu)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></div>
        <button style="height: 44px; border: 0; border-radius: 12px; background: #B91C1C; color: #fff; font-family: inherit; font-size: 14px; font-weight: 600">Забанить</button>
      </section>
      <section style="flex: 999 1 520px; min-width: 0; border: 1px solid var(--bd); border-radius: 16px; background: var(--sf); overflow-x: auto">
        <div style="padding: 14px 18px; border-bottom: 1px solid var(--bd); display: flex; justify-content: space-between; align-items: center; gap: 12px"><h2 style="margin: 0; font-size: 17px">Забаненные · 3</h2><label style="display: flex; align-items: center; gap: 8px; width: 240px; height: 36px; padding: 0 10px; border: 1px solid var(--bd); border-radius: 10px; color: var(--mu); box-sizing: border-box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"></path></svg><input placeholder="Поиск" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--tx); font-family: inherit; font-size: 13px; outline: 0"></label></div>
        <table style="width: 100%; min-width: 640px; border-collapse: collapse; font-size: 14px">
          <thead><tr style="text-align: left; color: var(--mu); font-size: 12px"><th style="padding: 10px 18px; border-bottom: 1px solid var(--bd); font-weight: 600">Пользователь</th><th style="padding: 10px 18px; border-bottom: 1px solid var(--bd); font-weight: 600">Причина</th><th style="padding: 10px 18px; border-bottom: 1px solid var(--bd); font-weight: 600">Когда · кем</th><th style="padding: 10px 18px; border-bottom: 1px solid var(--bd); font-weight: 600">Срок</th><th style="padding: 10px 18px; border-bottom: 1px solid var(--bd)"></th></tr></thead>
          <tbody>
            <sc-for list="{{bans}}" as="b" hint-placeholder-count="3">
              <tr>
                <td style="padding: 12px 18px; border-bottom: 1px solid var(--bd)"><div style="display: flex; align-items: center; gap: 10px"><span style="{{b.avSt}}; width: 32px; height: 32px; border-radius: 999px; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600">{{b.ini}}</span><div style="display: flex; flex-direction: column"><span style="font-weight: 600">{{b.name}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--mu)">{{b.id}}</span></div></div></td>
                <td style="padding: 12px 18px; border-bottom: 1px solid var(--bd); max-width: 240px">{{b.reason}}</td>
                <td style="padding: 12px 18px; border-bottom: 1px solid var(--bd); color: var(--mu); white-space: nowrap">{{b.when}}</td>
                <td style="padding: 12px 18px; border-bottom: 1px solid var(--bd); white-space: nowrap">{{b.term}}</td>
                <td style="padding: 12px 18px; border-bottom: 1px solid var(--bd); text-align: right"><button style="height: 34px; padding: 0 12px; border: 1px solid var(--bd); border-radius: 10px; background: var(--sf); color: var(--tx); font-family: inherit; font-size: 13px; font-weight: 500; white-space: nowrap">Снять бан</button></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  th(d){const t=d?{bg:'#111115',sf:'#1A1A20',s2:'#22222A',tx:'#ECECEF',mu:'#A3A3AD',bd:'#2E2E37',pr:'#5B54E0',prs:'#25234B',prt:'#B4B0FF',amb:'#3B2A0A',amt:'#FCD34D',rdb:'#3D1517',rdt:'#FCA5A5',gnb:'#0E2F1D',gnt:'#86EFAC',ov:'rgba(0,0,0,0.62)'}:{bg:'#FAFAFB',sf:'#FFFFFF',s2:'#F4F4F6',tx:'#1E1E24',mu:'#6B6B76',bd:'#E4E4E7',pr:'#3730A3',prs:'#EEEEFB',prt:'#3730A3',amb:'#FEF3C7',amt:'#92400E',rdb:'#FEE2E2',rdt:'#B91C1C',gnb:'#DCFCE7',gnt:'#166534',ov:'rgba(20,20,30,0.45)'};return Object.keys(t).map(k=>'--'+k+':'+t[k]).join(';');}
  renderVals() {
    const bn = (name, ini, c, id, reason, when, term) => ({ name, ini, avSt: 'background: ' + c, id, reason, when, term });
    return {
      tv: this.th(!!this.props.dark), dark: !!this.props.dark,
      bans: [
        bn('spam_bot_9000', 'S', '#334155', '771203984471236001', 'Спам заявками (40 за час)', '15 окт · dmitry.w', 'Навсегда'),
        bn('toxic.vova', 'T', '#C2410C', '603847102938475611', 'Оскорбления модераторов в анкете', '9 окт · Анна К.', 'до 9 ноя'),
        bn('multiacc_7', 'M', '#7C3AED', '590394857102938412', 'Твинк заблокированного игрока', '28 сен · Кирилл Н.', 'Навсегда')
      ]
    };
  }
}
</script>
</body>
</html>
