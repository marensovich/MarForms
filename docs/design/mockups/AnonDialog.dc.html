<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Подтверждение анонимной формы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}}; width: 640px; height: 600px; box-sizing: border-box; padding: 40px; display: grid; place-items: center; background: var(--ov); color: var(--tx); font-family: Onest, 'Segoe UI', system-ui, sans-serif">
  <div role="alertdialog" aria-modal="true" aria-labelledby="ad-t" style="width: 520px; box-sizing: border-box; padding: 24px; border-radius: 20px; background: var(--sf); border: 1px solid var(--bd); box-shadow: 0 24px 64px rgba(10,10,30,0.3); display: flex; flex-direction: column; gap: 16px">
    <span style="width: 48px; height: 48px; border-radius: 14px; background: var(--amb); color: var(--amt); display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10 10 0 0 1 12 20c-7 0-11-8-11-8a18 18 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.16 3.19M1 1l22 22"></path></svg></span>
    <div style="display: flex; flex-direction: column; gap: 6px"><h2 id="ad-t" style="margin: 0; font-size: 20px">Сделать форму анонимной?</h2><p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--mu)">Подходит для жалоб и опросов. Но вы потеряете часть контроля:</p></div>
    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{risks}}" as="r" hint-placeholder-count="4"><li style="display: flex; gap: 10px; font-size: 14px; line-height: 1.45"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--amt)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12h14"></path></svg>{{r}}</li></sc-for>
    </ul>
    <label style="display: flex; gap: 10px; padding: 12px; border-radius: 12px; background: var(--s2); font-size: 14px; line-height: 1.45; cursor: pointer"><span style="flex: none; width: 20px; height: 20px; border-radius: 6px; background: var(--pr); color: #fff; display: grid; place-items: center; margin-top: 1px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><input type="checkbox" checked="" style="position: absolute; opacity: 0; width: 1px; height: 1px">Я понимаю риски и беру ответственность за модерацию анонимных ответов</label>
    <div style="display: flex; justify-content: flex-end; gap: 8px">
      <button style="height: 44px; padding: 0 16px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf); color: var(--tx); font-family: inherit; font-size: 14px; font-weight: 500">Отмена</button>
      <button style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #B45309; color: #fff; font-family: inherit; font-size: 14px; font-weight: 600">Сделать анонимной</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":640,"height":600}}'>
class Component extends DCLogic {
  th(d){const t=d?{bg:'#111115',sf:'#1A1A20',s2:'#22222A',tx:'#ECECEF',mu:'#A3A3AD',bd:'#2E2E37',pr:'#5B54E0',prs:'#25234B',prt:'#B4B0FF',amb:'#3B2A0A',amt:'#FCD34D',rdb:'#3D1517',rdt:'#FCA5A5',gnb:'#0E2F1D',gnt:'#86EFAC',ov:'rgba(0,0,0,0.62)'}:{bg:'#FAFAFB',sf:'#FFFFFF',s2:'#F4F4F6',tx:'#1E1E24',mu:'#6B6B76',bd:'#E4E4E7',pr:'#3730A3',prs:'#EEEEFB',prt:'#3730A3',amb:'#FEF3C7',amt:'#92400E',rdb:'#FEE2E2',rdt:'#B91C1C',gnb:'#DCFCE7',gnt:'#166534',ov:'rgba(20,20,30,0.45)'};return Object.keys(t).map(k=>'--'+k+':'+t[k]).join(';');}
  renderVals() {
    return {
      tv: this.th(!!this.props.dark),
      risks: ['Вы не увидите Discord-аккаунт автора и не сможете с ним связаться', 'Нельзя ограничить «1 заявка на человека» и проверять роли', 'Баны сервера не действуют — форму сможет заполнить кто угодно', 'Запрос доработки недоступен: только принять или отклонить']
    };
  }
}
</script>
</body>
</html>
