<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Состояние доступа — desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}}; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--tx); font-family: Onest, 'Segoe UI', system-ui, sans-serif">
  <header style="background: var(--sf); border-bottom: 1px solid var(--bd)">
    <div style="max-width: 1280px; margin: 0 auto; height: 60px; padding: 0 32px; display: flex; align-items: center; gap: 16px">
      <a href="/LandingDesktop.dc.html" style="display: flex; align-items: center; gap: 10px; color: var(--tx); text-decoration: none; font-weight: 700; font-size: 16px"><span style="width: 28px; height: 28px; border-radius: 9px; background: var(--pr); color: #fff; display: grid; place-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M7 7h10M7 12h10M7 17h5"></path></svg></span>MarForms</a>
      <span style="flex: 1"></span>
      <a href="/MySubsDesktop.dc.html" style="color: var(--tx); text-decoration: none; font-size: 14px; font-weight: 500">Мои заявки</a>
    </div>
  </header>
  <main style="flex: 1; display: grid; place-items: center; padding: 64px 24px">
    <div style="width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 16px">
      <sc-if value="{{s.server}}" hint-placeholder-val="{{true}}">
        <span style="align-self: center; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--mu)"><span style="width: 28px; height: 28px; border-radius: 9px; background: #B45309; color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700">LS</span>Los Santos RP · Набор в LSPD</span>
      </sc-if>
      <div style="padding: 40px; border: 1px solid var(--bd); border-radius: 20px; background: var(--sf); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
        <span style="{{s.icSt}}; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.ic}}"></path></svg></span>
        <span style="{{s.icSt}}; padding: 4px 11px; border-radius: 99px; font-size: 12px; font-weight: 700">{{s.badge}}</span>
        <h1 style="margin: 0; font-size: 26px; letter-spacing: -0.01em">{{s.title}}</h1>
        <p style="margin: 0; max-width: 440px; font-size: 15px; line-height: 1.6; color: var(--mu)">{{s.text}}</p>
        <sc-if value="{{s.hasRoles}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center"><sc-for list="{{s.roles}}" as="r" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--bd); border-radius: 99px; font-size: 13px; font-weight: 500"><span style="{{r.dot}}; width: 8px; height: 8px; border-radius: 99px"></span>{{r.t}}</span></sc-for></div>
        </sc-if>
        <sc-if value="{{s.hasReason}}" hint-placeholder-val="{{false}}">
          <dl style="margin: 0; width: 100%; padding: 14px 16px; box-sizing: border-box; border-radius: 12px; background: var(--bg); display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; text-align: left; font-size: 13px"><dt style="color: var(--mu)">Причина</dt><dd style="margin: 0; font-weight: 600">{{s.reason}}</dd><dt style="color: var(--mu)">До</dt><dd style="margin: 0; font-weight: 600">{{s.until}}</dd><dt style="color: var(--mu)">Апелляции</dt><dd style="margin: 0"><a href="#" style="color: var(--prt); font-weight: 600">discord.gg/marforms-appeals</a></dd></dl>
        </sc-if>
        <div style="display: flex; gap: 10px; padding-top: 8px">
          <sc-if value="{{s.discord}}" hint-placeholder-val="{{false}}"><a href="/Login.dc.html" style="height: 46px; padding: 0 20px; border-radius: 12px; background: #5865F2; color: #fff; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.4 18.4 0 0 0-5.5 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2.1a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.8 19.8 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7zM8.5 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm7 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"></path></svg>Войти через Discord</a></sc-if>
          <sc-if value="{{s.hasPrimary}}" hint-placeholder-val="{{true}}"><button style="height: 46px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--pr); color: #fff; font-family: inherit; font-size: 15px; font-weight: 600">{{s.primary}}</button></sc-if>
          <a href="/MySubsDesktop.dc.html" style="height: 46px; padding: 0 18px; border: 1px solid var(--bd); border-radius: 12px; color: var(--tx); text-decoration: none; font-size: 15px; font-weight: 500; display: flex; align-items: center">{{s.secondary}}</a>
        </div>
      </div>
      <span style="align-self: center; font-size: 12px; color: var(--mu); font-family: 'JetBrains Mono', monospace">{{s.code}}</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"state":{"editor":"enum","options":["login","notMember","banned","missingRole","deniedRole","rolesError","notOpen","closed","archived","notFound","error","restricted"],"default":"missingRole"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  th(d){const t=d?{bg:'#111115',sf:'#1A1A20',s2:'#22222A',tx:'#ECECEF',mu:'#A3A3AD',bd:'#2E2E37',pr:'#5B54E0',prs:'#25234B',prt:'#B4B0FF',amb:'#3B2A0A',amt:'#FCD34D',rdb:'#3D1517',rdt:'#FCA5A5',gnb:'#0E2F1D',gnt:'#86EFAC',ov:'rgba(0,0,0,0.62)'}:{bg:'#FAFAFB',sf:'#FFFFFF',s2:'#F4F4F6',tx:'#1E1E24',mu:'#6B6B76',bd:'#E4E4E7',pr:'#3730A3',prs:'#EEEEFB',prt:'#3730A3',amb:'#FEF3C7',amt:'#92400E',rdb:'#FEE2E2',rdt:'#B91C1C',gnb:'#DCFCE7',gnt:'#166534',ov:'rgba(20,20,30,0.45)'};return Object.keys(t).map(k=>'--'+k+':'+t[k]).join(';');}
  renderVals() {
    const T = { amb: 'background: var(--amb); color: var(--amt)', red: 'background: var(--rdb); color: var(--rdt)', gr: 'background: var(--s2); color: var(--mu)', pr: 'background: var(--prs); color: var(--prt)' };
    const IC = { lock: 'M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4', user: 'M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M8.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM20 8v6M23 11h-6', ban: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM4.93 4.93l14.14 14.14', shield: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z', x: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM15 9l-6 6M9 9l6 6', refresh: 'M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15', clock: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2', box: 'M21 8v13H3V8M1 3h22v5H1zM10 12h4', search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35', alert: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 8v4M12 16h.01' };
    const S = {
      login: { t: 'pr', i: 'lock', badge: 'Нужен вход', title: 'Войдите, чтобы открыть форму', text: 'Форма доступна участникам сервера. Мы проверим вашу роль через Discord — пароль не нужен.', discord: 1, secondary: 'На главную', code: 'AUTH_REQUIRED' },
      notMember: { t: 'amb', i: 'user', badge: 'Не на сервере', title: 'Вы не участник сервера', text: 'Форма открыта только для участников Los Santos RP. Вступите на сервер и откройте ссылку снова.', primary: 'Вступить на сервер', secondary: 'Мои заявки', code: 'NOT_GUILD_MEMBER' },
      banned: { t: 'red', i: 'ban', badge: 'Бан на сервере', title: 'Вы заблокированы на этом сервере', text: 'Администрация Los Santos RP ограничила вам подачу заявок. Решение принимает сервер, а не MarForms.', reason: 'Нарушение правил NonRP', until: '30.10.2026', secondary: 'Мои заявки', code: 'GUILD_BANNED' },
      missingRole: { t: 'amb', i: 'shield', badge: 'Нужна роль', title: 'У вас нет нужной роли', text: 'Подать заявку могут участники с одной из этих ролей Discord:', roles: [['Гражданин', '#22C55E'], ['Верифицирован', '#3B82F6']], primary: 'Проверить роли снова', secondary: 'Мои заявки', code: 'ROLE_REQUIRED' },
      deniedRole: { t: 'red', i: 'x', badge: 'Запрещённая роль', title: 'Ваша роль закрывает доступ к форме', text: 'У вас есть роль, которой подача заявок запрещена. Запрет сильнее разрешения.', roles: [['Чёрный список', '#EF4444']], secondary: 'Мои заявки', code: 'ROLE_DENIED' },
      rolesError: { t: 'amb', i: 'refresh', badge: 'Discord не ответил', title: 'Не удалось проверить роли', text: 'Discord временно не отдаёт список ваших ролей. Обычно это проходит за минуту.', primary: 'Повторить', secondary: 'Мои заявки', code: 'ROLE_CHECK_FAILED' },
      notOpen: { t: 'pr', i: 'clock', badge: 'Скоро', title: 'Приём заявок ещё не начался', text: 'Форма откроется 20 октября в 18:00 по Москве. Сохраните ссылку.', primary: 'Напомнить в Discord', secondary: 'На главную', code: 'NOT_OPEN_YET' },
      closed: { t: 'gr', i: 'lock', badge: 'Закрыта', title: 'Приём заявок закрыт', text: 'Набор завершился 15 октября. Следите за анонсами в Discord сервера.', secondary: 'Мои заявки', code: 'FORM_CLOSED' },
      archived: { t: 'gr', i: 'box', badge: 'В архиве', title: 'Форма перенесена в архив', text: 'Эта форма больше не используется. Если вы уже подавали заявку, её статус есть в «Мои заявки».', secondary: 'Мои заявки', code: 'FORM_ARCHIVED' },
      notFound: { t: 'gr', i: 'search', badge: '404', title: 'Форма не найдена', text: 'Проверьте ссылку: возможно, в ней опечатка или форму удалили.', primary: 'На главную', secondary: 'Мои заявки', code: 'FORM_NOT_FOUND', noServer: 1 },
      error: { t: 'red', i: 'alert', badge: 'Ошибка', title: 'Что-то пошло не так', text: 'Мы не смогли загрузить форму. Попробуйте ещё раз через несколько секунд.', primary: 'Повторить', secondary: 'На главную', code: 'ERR 502 · req 7f3a91c2', noServer: 1 },
      restricted: { t: 'red', i: 'lock', badge: 'Аккаунт ограничен', title: 'Доступ ограничен', text: 'Ваш доступ к MarForms ограничен. Если считаете это ошибкой, напишите в поддержку и укажите свой Discord ID.', reason: 'Мультиаккаунты', until: 'бессрочно', secondary: 'Выйти', code: 'ACCOUNT_RESTRICTED', noServer: 1 }
    };
    const k = this.props.state || 'missingRole';
    const x = S[k] || S.missingRole;
    return {
      tv: this.th(!!this.props.dark), dark: !!this.props.dark,
      s: {
        icSt: T[x.t], ic: IC[x.i], badge: x.badge, title: x.title, text: x.text, code: x.code, secondary: x.secondary,
        server: !x.noServer, discord: !!x.discord, hasPrimary: !!x.primary, primary: x.primary || '',
        hasRoles: !!x.roles, roles: (x.roles || []).map(r => ({ t: r[0], dot: 'background: ' + r[1] })),
        hasReason: !!x.reason, reason: x.reason || '', until: x.until || ''
      }
    };
  }
}
</script>
</body>
</html>
