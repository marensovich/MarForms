<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Состояния доступа к форме</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="{{tv}}; width: 1760px; height: 2240px; box-sizing: border-box; padding: 32px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px; align-content: start; background: var(--s2); color: var(--tx); font-family: Onest, 'Segoe UI', system-ui, sans-serif">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="12">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--mu)">{{s.route}}</span>
      <div style="width: 390px; height: 660px; box-sizing: border-box; border: 1px solid var(--bd); border-radius: 28px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column">
        <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--sf); border-bottom: 1px solid var(--bd)">
          <span style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px"><span style="width: 28px; height: 28px; border-radius: 9px; background: var(--pr); color: #fff; display: grid; place-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 7h10M7 12h10M7 17h5"></path></svg></span>MarForms</span>
          <span style="font-size: 14px; color: var(--prt); font-weight: 500">Мои заявки</span>
        </header>
        <sc-if value="{{s.hasForm}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--bd); background: var(--sf)">
            <span style="width: 32px; height: 32px; border-radius: 10px; background: #B45309; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px">LS</span>
            <div style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 14px">Заявка в LSPD</span><span style="font-size: 12px; color: var(--mu)">Los Santos RP</span></div>
          </div>
        </sc-if>
        <div style="flex: 1; padding: 32px 22px 24px; display: flex; flex-direction: column; gap: 16px">
          <span style="{{s.iconSt}}; width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg></span>
          <span style="{{s.iconSt}}; align-self: flex-start; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600">{{s.badge}}</span>
          <h2 style="margin: 0; font-size: 22px; line-height: 1.25">{{s.title}}</h2>
          <p style="margin: 0; font-size: 15px; line-height: 1.5; color: var(--mu)">{{s.text}}</p>
          <sc-if value="{{s.hasChips}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{s.chips}}" as="c" hint-placeholder-count="2">
                <span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--bd); background: var(--sf); font-size: 13px; font-weight: 500"><span style="width: 9px; height: 9px; border-radius: 999px; background: {{c.color}}"></span>{{c.name}}</span>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{s.hasMeta}}" hint-placeholder-val="{{false}}">
            <span style="padding: 10px 12px; border-radius: 10px; background: var(--s2); border: 1px solid var(--bd); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--mu)">{{s.meta}}</span>
          </sc-if>
          <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
            <sc-if value="{{s.hasPrimary}}" hint-placeholder-val="{{true}}">
              <button style="{{s.pst}}; height: 48px; border: 0; border-radius: 12px; color: #fff; font-family: inherit; font-size: 15px; font-weight: 600">{{s.primary}}</button>
            </sc-if>
            <sc-if value="{{s.hasSecondary}}" hint-placeholder-val="{{true}}">
              <button style="height: 48px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf); color: var(--tx); font-family: inherit; font-size: 15px; font-weight: 500">{{s.secondary}}</button>
            </sc-if>
          </div>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1760,"height":2240}}'>
class Component extends DCLogic {
  th(d){const t=d?{bg:'#111115',sf:'#1A1A20',s2:'#22222A',tx:'#ECECEF',mu:'#A3A3AD',bd:'#2E2E37',pr:'#5B54E0',prs:'#25234B',prt:'#B4B0FF',amb:'#3B2A0A',amt:'#FCD34D',rdb:'#3D1517',rdt:'#FCA5A5',gnb:'#0E2F1D',gnt:'#86EFAC',ov:'rgba(0,0,0,0.62)'}:{bg:'#FAFAFB',sf:'#FFFFFF',s2:'#F4F4F6',tx:'#1E1E24',mu:'#6B6B76',bd:'#E4E4E7',pr:'#3730A3',prs:'#EEEEFB',prt:'#3730A3',amb:'#FEF3C7',amt:'#92400E',rdb:'#FEE2E2',rdt:'#B91C1C',gnb:'#DCFCE7',gnt:'#166534',ov:'rgba(20,20,30,0.45)'};return Object.keys(t).map(k=>'--'+k+':'+t[k]).join(';');}
  renderVals() {
    const tone = { in: 'background: var(--prs); color: var(--prt)', am: 'background: var(--amb); color: var(--amt)', rd: 'background: var(--rdb); color: var(--rdt)', gn: 'background: var(--gnb); color: var(--gnt)', ne: 'background: var(--s2); color: var(--mu); border: 1px solid var(--bd)' };
    const I = {
      lock: 'M5 11h14v10H5zM7 11V7a5 5 0 0 1 10 0v4', users: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      ban: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM4.93 4.93l14.14 14.14', tag: 'M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82zM7 7h.01',
      alert: 'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01', clock: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',
      archive: 'M21 8v13H3V8M1 3h22v5H1zM10 12h4', search: 'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35', x: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM15 9l-6 6M9 9l6 6', check: 'M20 6 9 17l-5-5'
    };
    const P = { dc: 'background: #5865F2', pr: 'background: var(--pr)' };
    const st = (route, t, icon, badge, title, text, o) => {
      o = o || {};
      return { route, iconSt: tone[t], icon: I[icon], badge, title, text, hasForm: o.form !== false, chips: o.chips || [], hasChips: !!o.chips, meta: o.meta || '', hasMeta: !!o.meta, primary: o.p || '', hasPrimary: !!o.p, pst: P[o.pk || 'pr'], secondary: o.s || '', hasSecondary: !!o.s };
    };
    return {
      tv: this.th(!!this.props.dark),
      states: [
        st('/f/lspd · login-required', 'in', 'lock', 'Нужен вход', 'Войдите, чтобы подать заявку', 'Форма доступна только участникам сервера. Войдите через Discord — мы проверим членство и роли.', { p: 'Войти через Discord', pk: 'dc' }),
        st('/f/lspd · not-member', 'in', 'users', 'Не участник сервера', 'Вы не состоите на сервере', 'Вступите на сервер Los Santos RP в Discord, затем вернитесь к форме.', { p: 'Открыть приглашение', s: 'Проверить снова' }),
        st('/f/lspd · banned', 'rd', 'ban', 'Доступ заблокирован', 'Вы не можете подавать заявки на этом сервере', 'Модераторы ограничили вам доступ к формам. Если это ошибка, напишите в #поддержка.', { meta: 'Причина: спам заявками · 3 окт 2026', s: 'Мои заявки' }),
        st('/f/lspd · role-missing', 'in', 'tag', 'Нужна роль', 'Не хватает роли на сервере', 'Для этой формы нужна хотя бы одна из ролей:', { chips: [{ name: 'Гражданин', color: '#22C55E' }, { name: 'Верифицирован', color: '#3B82F6' }], p: 'Проверить роли снова' }),
        st('/f/lspd · role-denied', 'rd', 'tag', 'Запрещённая роль', 'Ваша роль закрывает доступ к форме', 'У вас есть роль, с которой эта форма недоступна. Запрет действует, даже если есть разрешённые роли.', { chips: [{ name: 'ЧС фракций', color: '#EF4444' }], s: 'Мои заявки' }),
        st('/f/lspd · roles-unchecked', 'am', 'alert', 'Роли не проверены', 'Не удалось проверить ваши роли', 'Discord не ответил вовремя или у бота нет доступа к серверу. Попробуйте через минуту.', { p: 'Попробовать снова' }),
        st('/f/lspd · not-open', 'am', 'clock', 'Скоро откроется', 'Приём заявок ещё не начался', 'Форма откроется 1 ноября в 12:00 по Москве. Сохраните ссылку.', { s: 'На главную' }),
        st('/f/lspd · closed', 'ne', 'lock', 'Приём закрыт', 'Форма больше не принимает заявки', 'Приём завершился 30 октября. Следите за анонсами на сервере.', { s: 'Мои заявки' }),
        st('/f/lspd · archived', 'ne', 'archive', 'В архиве', 'Форма перенесена в архив', 'Администраторы сервера убрали её из работы. Отправленные заявки сохранены.', { s: 'Мои заявки' }),
        st('/f/unknown · not-found', 'ne', 'search', 'Ошибка 404', 'Форма не найдена', 'Проверьте ссылку — возможно, в ней опечатка или форму удалили.', { form: false, p: 'Ввести другую ссылку', s: 'На главную' }),
        st('/f/lspd · error', 'rd', 'x', 'Ошибка', 'Что-то пошло не так', 'Не удалось загрузить форму. Обновите страницу или попробуйте позже.', { form: false, meta: 'ref 9b2e-04aa', p: 'Попробовать снова' }),
        st('/f/lspd · success', 'gn', 'check', 'Отправлено', 'Заявка отправлена', 'Модераторы рассмотрят её в ближайшее время. Решение придёт в личные сообщения Discord.', { meta: 'Заявка #1048 · 15 окт, 18:42', p: 'Мои заявки', s: 'На главную' })
      ]
    };
  }
}
</script>
</body>
</html>
